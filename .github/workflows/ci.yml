# Läuft bei jedem Push und jedem Pull Request.
#
# lint:     dieselben Hooks wie lokal beim Commit (.pre-commit-config.yaml: Ruff, YAML).
#           Fängt Commits ab, bei denen der Hook fehlte oder mit --no-verify übergangen wurde.
# backend:  die pytest-Suite gegen eine echte MongoDB (wie im Container,
#           nur ohne Docker Compose - die Tests brauchen keinen laufenden Server).
# frontend: der Produktions-Build. Er läuft durch ESLint und fängt damit Fehler,
#           die die Backend-Suite nicht sieht (siehe backend/tests/conftest.py).
# e2e:      Playwright im Browser gegen den kompletten Stack aus e2e/docker-compose.yml
#           (leere MongoDB, Backend-Image, Produktions-Build des Frontends):
#           Smoke-Test über alle Bereiche und der Kernablauf Schüler -> iPad -> Vertrag.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017
      # Nur für die Tests; ohne Wert würde core/config.py einen zufälligen erzeugen.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Systempakete (libmagic für python-magic)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: pytest
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Abhängigkeiten
        run: yarn install --frozen-lockfile --network-timeout 300000

      - name: Build (inkl. ESLint)
        # react-scripts macht bei CI=true aus jeder ESLint-Warnung einen Fehler. Der
        # Produktions-Build im Docker-Image läuft ohne CI=true - hier dasselbe Verhalten,
        # damit die Pipeline genau dann rot wird, wenn auch der Deploy scheitern würde.
        env:
          CI: "false"
        run: yarn build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - name: Stack bauen und starten
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - name: Logs des Stacks
        if: failure()
        run: docker compose logs --no-color

      - name: Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Stack abbauen
        if: always()
        run: docker compose down -v
