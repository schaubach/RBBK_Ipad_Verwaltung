# Läuft bei jedem Push und jedem Pull Request.
#
# backend:  die pytest-Suite gegen eine echte MongoDB (wie im Container,
#           nur ohne Docker Compose - die Tests brauchen keinen laufenden Server).
# frontend: der Produktions-Build. Er läuft durch ESLint und fängt damit Fehler,
#           die die Backend-Suite nicht sieht (siehe backend/tests/conftest.py).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017
      # Nur für die Tests; ohne Wert würde core/config.py einen zufälligen erzeugen.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Systempakete (libmagic für python-magic)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: pytest
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Abhängigkeiten
        run: yarn install --frozen-lockfile --network-timeout 300000

      - name: Build (inkl. ESLint)
        # react-scripts macht bei CI=true aus jeder ESLint-Warnung einen Fehler. Der
        # Produktions-Build im Docker-Image läuft ohne CI=true - hier dasselbe Verhalten,
        # damit die Pipeline genau dann rot wird, wenn auch der Deploy scheitern würde.
        env:
          CI: "false"
        run: yarn build
